<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dawa Dost Live</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF8EE;--ink:#1F2547;--mint:#3DDC97;--coral:#FF6B6B;--sun:#FFD23F;--sky:#6EC6FF;--lav:#B79CFF}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Nunito',sans-serif;font-weight:800;background-image:radial-gradient(circle at 10% 10%,#ffe9b8,transparent 35%),radial-gradient(circle at 90% 90%,#d9f7e8,transparent 35%)}
h1,h2,.num{font-family:'Fredoka',sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:28px;display:grid;grid-template-columns:340px 1fr;gap:28px}
@media(max-width:850px){.wrap{grid-template-columns:1fr}}
.card{background:#fff;border:3px solid var(--ink);border-radius:30px;padding:24px;box-shadow:0 7px 0 var(--ink)}
h1{font-size:44px;margin:0 0 6px}
.qr{text-align:center}.qr canvas{border:3px solid var(--ink);border-radius:20px;max-width:100%}
.url{font-size:18px;word-break:break-all;margin-top:10px}
.moods{display:grid;gap:16px;margin-top:10px}
.m{display:grid;grid-template-columns:70px 1fr 70px;gap:14px;align-items:center}
.m .e{font-size:48px;text-align:center}
.track{height:38px;border:3px solid var(--ink);border-radius:99px;overflow:hidden;background:#fff}
.fill{height:100%;width:0;transition:width .6s cubic-bezier(.2,.9,.3,1.2)}
.m .num{font-size:36px;text-align:right}
.big{display:flex;gap:20px;margin-top:22px}
.big .card{flex:1;text-align:center}
.big .num{font-size:92px;line-height:1}
.mint{background:#d9f7e8}.sun{background:#fff3c4}
.small{font-size:15px;opacity:.65}
.pop{animation:pop .5s}@keyframes pop{40%{transform:scale(1.15)}}
button.r{position:fixed;right:10px;bottom:10px;opacity:.15;border:0;background:none;font-size:20px;cursor:pointer}
button.r:hover{opacity:1}
canvas#cf{position:fixed;inset:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="cf"></canvas>
<div class="wrap">
  <div class="card qr">
    <h2 style="margin:0 0 12px;font-size:26px">📱 Scan &amp; join</h2>
    <canvas id="qr"></canvas>
    <div class="url" id="url"></div>
    <div class="small" style="margin-top:8px">QR کوڈ اسکین کریں · tap your mood · adopt a grandparent</div>
  </div>
  <div>
    <h1>Dawa Dost <span style="font-size:28px">· Live Room</span></h1>
    <div class="small" style="font-size:20px">How are you feeling right now? / آپ کیسا محسوس کر رہے ہیں؟</div>
    <div class="card" style="margin-top:18px"><div class="moods" id="moods"></div></div>
    <div class="big">
      <div class="card mint"><div class="num" id="adopted">0</div><div style="font-size:24px">🧓 grandparents adopted<br><span class="small">بزرگ اپنائے گئے</span></div></div>
      <div class="card sun"><div class="num" id="count">0</div><div style="font-size:24px">🙋 people joined<br><span class="small">شرکاء</span></div></div>
    </div>
  </div>
</div>
<button class="r" id="reset" title="reset">↺</button>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const MOODS=[['great','😄','#3DDC97'],['ok','🙂','#6EC6FF'],['tired','😴','#B79CFF'],['stressed','😣','#FF6B6B']];
const joinUrl=location.origin+'/join.html'; $('#url').textContent=joinUrl;
const mk=()=>{ if(window.QRCode)QRCode.toCanvas($('#qr'),joinUrl,{width:300,margin:1,color:{dark:'#1F2547',light:'#ffffff'}}); else setTimeout(mk,300) }; mk();
$('#moods').innerHTML=MOODS.map(([k,e,c])=>`<div class="m"><div class="e">${e}</div><div class="track"><div class="fill" id="f_${k}" style="background:${c}"></div></div><div class="num" id="n_${k}">0</div></div>`).join('');
let prev={adopted:0,count:0};
function render(d){
  const max=Math.max(1,...Object.values(d.moods));
  MOODS.forEach(([k])=>{$('#f_'+k).style.width=(d.moods[k]/max*100)+'%';$('#n_'+k).textContent=d.moods[k]});
  for(const k of ['adopted','count']){const el=$('#'+k); if(el.textContent!=String(d[k])){el.textContent=d[k];el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}}
  if(d.adopted>prev.adopted)confetti(60); prev=d;
}
function start(){const es=new EventSource('/api/live/stream'); es.onmessage=e=>render(JSON.parse(e.data)); es.onerror=()=>{es.close();setTimeout(start,2000)}} start();
$('#reset').onclick=async()=>{const key=prompt('Admin key (leave empty if none)')||''; await fetch('/api/live/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key})})};
const cv=$('#cf'),cx=cv.getContext('2d');let P=[],raf=0;const fit=()=>{cv.width=innerWidth;cv.height=innerHeight};fit();addEventListener('resize',fit);
function confetti(n){const c=['#3DDC97','#FF6B6B','#FFD23F','#6EC6FF','#B79CFF'];for(let i=0;i<n;i++)P.push({x:innerWidth*(.3+Math.random()*.4),y:innerHeight*.5,vx:(Math.random()-.5)*16,vy:-Math.random()*16-4,r:Math.random()*7+4,c:c[i%5],a:0,l:100});if(!raf)loop()}
function loop(){cx.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>p.l>0);for(const p of P){p.vy+=.5;p.x+=p.vx;p.y+=p.vy;p.a+=.2;p.l--;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.globalAlpha=Math.min(1,p.l/30);cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore()}raf=P.length?requestAnimationFrame(loop):0;if(!raf)cx.clearRect(0,0,cv.width,cv.height)}
</script>
</body>
</html>
