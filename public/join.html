<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Join Dawa Dost</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF8EE;--ink:#1F2547;--mint:#3DDC97;--coral:#FF6B6B;--sun:#FFD23F;--sky:#6EC6FF;--lav:#B79CFF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Nunito',sans-serif;font-weight:800;padding:20px;max-width:480px;margin:0 auto}
h1,h2{font-family:'Fredoka',sans-serif;margin:8px 0}
h1{font-size:34px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}
.mood{border:3px solid var(--ink);border-radius:26px;background:#fff;padding:18px 6px;font:inherit;font-size:16px;color:var(--ink);box-shadow:0 5px 0 var(--ink);cursor:pointer}
.mood span{display:block;font-size:54px}
.mood:active{transform:translateY(5px);box-shadow:none}
.mood.on{background:var(--sun)}
.go{display:block;width:100%;border:3px solid var(--ink);border-radius:26px;background:var(--mint);padding:18px;font:inherit;font-size:19px;color:var(--ink);box-shadow:0 5px 0 var(--ink);cursor:pointer;text-align:center;text-decoration:none}
.go:active{transform:translateY(5px);box-shadow:none}.go[disabled]{opacity:.5}
.small{opacity:.7;font-size:15px}
.ur{font-family:'Noto Nastaliq Urdu',serif;line-height:2}
</style>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
<h1>💊 Dawa Dost</h1>
<h2>How are you feeling?</h2><div class="small ur">آپ کیسا محسوس کر رہے ہیں؟</div>
<div class="grid" id="g"></div>
<button class="go" id="adopt" style="background:var(--lav)">🧓 I'll set this up for a grandparent<br><span class="small ur">میں کسی بزرگ کے لیے یہ لگاؤں گا/گی</span></button>
<p></p>
<a class="go" href="/" style="background:var(--sky)">Try Dawa Dost →</a>
<script>
const $=s=>document.querySelector(s);
const M=[['great','😄','Great','بہت اچھا'],['ok','🙂','Okay','ٹھیک ہوں'],['tired','😴','Tired','تھکا ہوا'],['stressed','😣','Stressed','پریشان']];
const get=k=>{try{return localStorage.getItem('dd_live_'+k)}catch{return null}}, set=(k,v)=>{try{localStorage.setItem('dd_live_'+k,v)}catch{}};
const post=b=>fetch('/api/live/vote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
$('#g').innerHTML=M.map(([k,e,en,ur])=>`<button class="mood ${get('mood')===k?'on':''}" data-k="${k}"><span>${e}</span>${en}<br><small class="ur">${ur}</small></button>`).join('');
$('#g').onclick=async ev=>{const b=ev.target.closest('.mood');if(!b)return; if(get('mood')){navigator.vibrate&&navigator.vibrate(30);return}
  const r=await post({type:'mood',mood:b.dataset.k}); if(r.ok){set('mood',b.dataset.k);b.classList.add('on');navigator.vibrate&&navigator.vibrate(60)}};
if(get('adopt')){$('#adopt').disabled=true;$('#adopt').textContent='✓ Thank you! شکریہ'}
$('#adopt').onclick=async()=>{if(get('adopt'))return;const r=await post({type:'adopt'});if(r.ok){set('adopt','1');$('#adopt').disabled=true;$('#adopt').textContent='✓ Thank you! شکریہ';navigator.vibrate&&navigator.vibrate([60,40,60])}};
</script>
</body>
</html>
